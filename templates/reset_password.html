{% extends 'base.html' %}
{% block title %}Reset Password — AutismAI{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🔑</div>
            <h2>Reset Password</h2>
            <p>Enter your new password below</p>
        </div>

        {% if error and not token %}
        <div class="alert alert-error">⚠️ {{ error }}</div>
        <a href="/forgot-password" class="btn-primary full-width"
           style="margin-top: 16px; display: block; text-align: center;">
            Request New Link
        </a>

        {% else %}

        {% if error %}
        <div class="alert alert-error">⚠️ {{ error }}</div>
        {% endif %}

        <form action="/reset-password/{{ token }}"
              method="POST" class="auth-form">
            <div class="form-group">
                <label>🔒 New Password</label>
                <input type="password" name="password"
                       placeholder="At least 6 characters"
                       required class="plain-input">
            </div>
            <div class="form-group">
                <label>🔒 Confirm New Password</label>
                <input type="password" name="confirm_password"
                       placeholder="Repeat your new password"
                       required class="plain-input">
            </div>
            <button type="submit" class="btn-primary full-width">
                Reset Password
            </button>
        </form>

        {% endif %}
    </div>
</div>
{% endblock %}
